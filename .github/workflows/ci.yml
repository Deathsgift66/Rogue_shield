name: Offline unit and safety tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q rogueshield
      - run: python -m unittest discover -s tests -v
      - run: python -m rogueshield review . --format json --out /tmp/rogueshield-review.json
      - run: python -m rogueshield swarm-preview --agents 700 --out /tmp/rogueshield-swarm.json
      - run: python -m rogueshield authz examples/demo-authz.json --format json --out /tmp/rogueshield-authz.json
      - run: python -m rogueshield compare /tmp/rogueshield-review.json /tmp/rogueshield-review.json --format json --out /tmp/rogueshield-comparison.json
