[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rogueshield"
version = "0.5.0"
description = "Offline, authorization-conscious defensive software security review"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["security", "testing", "game-security", "defensive", "software-audit"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security", "License :: OSI Approved :: MIT License"]

[project.scripts]
rogueshield = "rogueshield.cli:main"

[tool.setuptools.packages.find]
include = ["rogueshield*"]
