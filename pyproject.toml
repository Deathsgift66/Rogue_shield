[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rogueshield"
version = "0.1.0"
description = "Defensive security review toolkit"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["security", "testing", "api"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]

[project.scripts]
rogueshield = "rogueshield.cli:main"

[tool.setuptools.packages.find]
include = ["rogueshield*"]
